name: Game framework rules
on:
  push:
    branches: [main]
    paths: ['xiaqing-motion-lab/dist/game/**', 'xiaqing-motion-lab/tests/game-acceptance.test.mjs', '.github/workflows/game-framework.yml']
  pull_request:
    paths: ['xiaqing-motion-lab/dist/game/**', 'xiaqing-motion-lab/tests/game-acceptance.test.mjs', '.github/workflows/game-framework.yml']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify game rules
        run: node --test xiaqing-motion-lab/tests/game-acceptance.test.mjs
