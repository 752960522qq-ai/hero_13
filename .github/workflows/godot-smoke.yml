name: Godot mobile project smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.4.1-stable
      - name: Verify engine
        run: godot --version
      - name: Import and validate project
        run: godot --headless --editor --path . --quit
      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 5
