<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151f2a"><title>英雄人物测试</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css?v=1"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><div class="brand"><span class="monogram">H</span><div><p class="eyebrow">CHARACTER / MOTION STUDY</p><h1>英雄人物测试</h1></div></div><span class="live"><i></i>动作实验室</span></header>
<main><section class="viewport" aria-label="三维人物预览"><div id="stage"></div><div class="stage-top"><span id="viewLabel">双星 / 待机</span><div class="views"><button data-view="front" title="正面视角">正面</button><button data-view="side" title="侧面视角">侧面</button><button data-view="back" title="背面视角">背面</button><button id="reset" title="重置视角">复位</button></div></div><div id="loading" role="status"><span class="spinner"></span><strong id="loadingTitle">正在准备人物</strong><p id="loadingText">载入模型与动作…</p><button id="retry" hidden>重新载入</button></div><span class="hint">拖动旋转 · 双指缩放</span><div class="stage-bottom"><span class="axis"><i></i>人物预览</span><button id="skeleton" aria-pressed="false" disabled>显示骨骼</button></div></section>
<aside class="panel"><div class="panel-heading"><div><p class="eyebrow">01 / 选择人物</p><h2 id="characterTitle">双星</h2></div><a id="download" class="download" href="./assets/double_stars.glb" download="双星_动作适配.glb">下载 GLB <span>↗</span></a></div><div class="characters" aria-label="选择人物"><button class="character selected" data-character="double_stars" aria-pressed="true"><span class="number">01</span><span><strong>双星</strong><small>骨骼与动作适配</small></span><span class="mark">✓</span></button><button class="character" data-character="superman" aria-pressed="false"><span class="number">02</span><span><strong>超人</strong><small>原始骨架对照</small></span><span class="mark">✓</span></button></div>
<div class="section-label"><span>02 / 动作预览</span><output id="motionLabel">待机</output></div><div class="actions"><button data-action="Idle" class="selected" disabled><span>Ⅰ</span>待机</button><button data-action="Walk" disabled><span>Ⅱ</span>行走</button><button data-action="Run" disabled><span>Ⅲ</span>跑步</button></div>
<div class="timeline"><button id="play" disabled aria-label="暂停动画">Ⅱ</button><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="动作进度" disabled><output id="timeLabel">0.00 / 0.00 s</output></div><label class="speed"><span>播放速度</span><input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"><output id="speedLabel">1.00×</output></label><footer><span id="status" role="status">准备中</span><span>HERO / CHARACTER LAB</span></footer></aside></main><script type="module" src="./app.js?v=1"></script></body></html>
